name: Solar System WorksFlow 
on:
  workflow_dispatch:
  push:
    branches:
        - main
        - 'feature/*'
env:
    MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
    MONGO_USERNAME: superuser
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
             nodejs_version: [20, 24, 26]
             operating_system: [ubuntu-latest, macos-latest]
             exclude:
              - nodejs_version: 26
                operating_system: macos-latest
              - nodejs_version: 26
                operating_system: ubuntu-latest
              - nodejs_version: 24
                operating_system: macos-latest
              - nodejs_version: 20
                operating_system: macos-latest                
        runs-on: ${{ matrix.operating_system }}
        steps:
        - name: checkout Repository
          uses: actions/checkout@v4
        
        - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.nodejs_version }}
        - name: Cache NPM Dependencies
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Unit Testing
          run: npm test

        - name: Archive Test Results
          uses: actions/upload-artifact@v6
          with:
            name: Mocha-Test-Results
            path: test-results.xml
            overwrite: true

    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        steps:
        - name: checkout Registry
          uses: actions/checkout@v6
        - name: Setup NodeJS version - 22
          uses: actions/setup-node@v3
          with:
            node-version: 20
        - name: Cache NPM Dependencies
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
        - name: Install Dependencies
          run: npm install
        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage
        - name: Archive Test Results
          uses: actions/upload-artifact@v7
          with:
            name: Code-coverage-Results
            path: coverage
            retention-days: 5
    
    docker:
      name: Docker file 
      needs: [unit-testing,code-coverage]
      runs-on: ubuntu-latest
      steps:
      - name: checkout Repo
        uses: actions/checkout@v4
      
      - name: Dockerhub Login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD}}

    
    #  - name: Set up QEMU emulator
    #    uses: docker/setup-qemu-action@v3

    #  - name: Set up Docker Buildx
    #    uses: docker/setup-buildx-action@v3

      - name: Build Docker Image for Testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Run Container and Test `/live` Endpoint
        run: |
          docker run --rm --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          echo "Verifying /live endpoint"
          wget -q -O - http://127.0.0.1:3000/live | grep live

      - name: Docker Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
  
    Dev-Deployment:
      needs: docker
      runs-on: ubuntu-latest
      steps:
       - name: checkout Repository
         uses: actions/checkout@v4

       - name: Install kubectl CLI
         uses: azure/setup-kubectl@v3
         with:
           version: 'v1.26.0'

       - name: Configure AWS Credentials
         uses: aws-actions/configure-aws-credentials@v4
         with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1
       
       - name: Verify kubeconfig exists
         run: |
            echo "${{ secrets.KUBECONFIG }}" | head

       - name: Set Kubeconfig File
         uses: azure/k8s-set-context@v3
         with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}


       - name: Fetch Kubernetes Cluster Details
         run: |
           kubectl version --short
           echo "------------------------------------------"
           kubectl get nodes

       - name: Save Nginx Ingress IP
         id: ingress
         run: |
           echo "INGRESS_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV

       - name: Replace tokens in manifests
         uses: cschleiden/replace-tokens@v1
         with:
           tokenPrefix: '_{_'
           tokenSuffix: '_}_'
           files: kubernetes/development/*.yaml
         env:
           NAMESPACE: ${{ vars.NAMESPACE }}
           REPLICAS: ${{ vars.REPLICAS }}
           IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
           INGRESS_IP: ${{ env.INGRESS_IP }}

       - name: Verify replaced manifests
         run: |
            cat kubernetes/development/*.yaml
            echo "${{ vars.NAMESPACE }}"
            echo "${{ vars.DOCKERHUB_USERNAME }}"
       
       - name: Create MongoDB Secret
         run: |
           kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
             --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
             --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
             --from-literal=MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
             --save-config \
             --dry-run=client \
             -o yaml | kubectl apply -f -

       - name: Deploy to Dev Env
         run: |
            kubectl apply -f kubernetes/development
        
       - name: Test Command added
         run: |
            kubectl get nodes