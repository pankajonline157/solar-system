name: Solar System WorksFlow 
on:
  workflow_dispatch:
  push:
    branches:
        - main
        - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://cluster0.5hw9k.mongodb.net/'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: checkout Repository
          uses: actions/checkout@v4
        
        - name: Setup NodeJS Version -24
          uses: actions/setup-node@v6
          with:
            node-version: 24
        
        - name: Install Dependencies
          run: npm install

        - name: Unit Testing
          run: npm test